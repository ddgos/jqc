[workspace]
resolver = "2"
members = [
    "jqc-core",
    "jqc-compiler",
    "jqc-macros",
    "jqc",
    "examples",
]
# jqc-manual-tests(-macros) need $JQ_SRC (a jq source checkout; the Nix
# dev shell provides it) at compile time, not just at test-run time like
# the differential suite's $PATH jq. `exclude` (not just omitting them
# from `members`) keeps them out of *every* `--workspace` command, not
# only the no-argument default -- `cargo test --workspace` would
# otherwise still build them and fail for anyone outside the dev shell.
# Reach them via `cargo test --manifest-path jqc-manual-tests/Cargo.toml`.
exclude = [
    "jqc-manual-tests-macros",
    "jqc-manual-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
